version: 1

description: >
  Hugging Face datasets fetched file by file through the API (repos with few files).
  Repos with many files, and git / Zenodo / URL sources, are in sources_v2.yaml.

storage:
  output_dir: D:/data/diagram_extraction
  max_total_size: 10 GB
  min_free_after_download: 5 GB

defaults:
  repo_type: dataset
  revision: main
  stage: small_high_priority
  priority: high
  enabled: true
  gated: false
  allow_patterns:
    - "**"
  ignore_patterns:
    - ".gitattributes"
    - "**/.gitattributes"

datasets:

  - key: mermaid_50k
    name: Mermaid 50K
    repo_id: CoreFidelity/Mermaid_50K
    category: diagram_code
    expected_size: 51.4 MB
    expected_size_bytes: 51412474
    max_allowed_size: 100 MB
    local_dir: diagram_code/CoreFidelity__Mermaid_50K
    allow_patterns:
      - mermaid_50k.jsonl
    notes: >
      Mermaid code focused dataset. SVG renders are intentionally skipped for the first pass because they add
      about 4.4 GB. DEPRECATED upstream (superseded by the paid Mermaid_500k). License is PolyForm Noncommercial
      (no derivative works) - evaluation only, never in the training mix of the public model.

  - key: mermaid_flowchart_transformer
    name: Mermaid Flowchart Transformer
    repo_id: rakitha/mermaid-flowchart-transformer
    category: diagram_code
    expected_size: 153.9 MB
    expected_size_bytes: 153902505
    max_allowed_size: 1 GB
    local_dir: diagram_code/rakitha__mermaid-flowchart-transformer
    notes: Flowchart-to-Mermaid training data.

  # ------------------------------------------------------------------------- #
  # Stage v2_diagram: image -> structure data for Tadpole (2026-10).
  # Licenses checked for a publicly released model; see notes.
  # FlowGen, image-to-mermaid-v3 and LogicBench-1K have too many files for the HF API
  # rate limit: they live in sources_v2.yaml (git clone via download_sources.py).
  # ------------------------------------------------------------------------- #

  - key: flowchart_to_mermaid
    name: Flowchart-to-Mermaid
    repo_id: DangIT02/flowchart-to-mermaid
    category: diagram_code
    stage: v2_diagram
    expected_size: 153.6 MB
    expected_size_bytes: 161048510
    max_allowed_size: 500 MB
    local_dir: diagram_code/DangIT02__flowchart-to-mermaid
    notes: MIT. 2,569 flowchart images + Mermaid (earlier flowchart-only release of image-to-mermaid).

  - key: cas2uml
    name: CAS2UML hand-drawn UML
    repo_id: Seym0n/cas2uml_hand-drawn_to_plantuml_dataset
    category: uml
    stage: v2_diagram
    expected_size: 154.0 MB
    expected_size_bytes: 161479975
    max_allowed_size: 500 MB
    local_dir: uml/Seym0n__cas2uml
    notes: CC-BY-4.0. 557 hand-drawn class (271) and activity (286) diagrams with PlantUML + XMI ground truth.

  - key: plantuml_stack_v2
    name: The Stack v2 PlantUML (filtered)
    repo_id: devgpt-aimotion/the-stack-v2_PlantUML_filtered
    category: uml
    stage: v2_diagram
    expected_size: 108.8 MB
    expected_size_bytes: 114068123
    max_allowed_size: 500 MB
    local_dir: uml/devgpt-aimotion__the-stack-v2_PlantUML
    allow_patterns:
      - README.md
      - filter_uml_no_nonlatin/*
      - strict_filter_uml_only_no_nonlatin/*
    notes: >
      PlantUML source only (no images) mined from GitHub: 98,861 (filtered) / 43,052 (strict UML-only) files.
      Must be rendered to images. Per-file licenses in detected_licenses - keep permissive ones only.
      data/ is skipped: it duplicates strict_filter_uml_only_no_nonlatin byte-for-byte.
