version: 1

description: >
  Base model manifest for the first diagram extraction training cycle. A zero-shot baseline, and LoRA/QLoRA fine-tuning rather than training from random initialization.

storage:
  output_dir: D:/data/diagram_extraction/models/base
  max_total_size: 8 GB
  min_free_after_download: 10 GB

defaults:
  repo_type: model
  revision: main
  stage: smoke_baseline
  priority: high
  enabled: true
  gated: false
  allow_patterns:
    - LICENSE
    - README.md
    - "*.json"
    - "*.txt"
    - "*.model"
    - "*.safetensors"
    - "tokenizer.*"
    - "vocab.*"
    - "merges.txt"
    - "preprocessor_config.json"
    - "processor_config.json"
    - "chat_template.json"
  ignore_patterns:
    - ".gitattributes"
    - "*.bin"
    - "*.ckpt"
    - "*.gguf"
    - "*.h5"
    - "*.msgpack"
    - "*.onnx"
    - "*.ot"
    - "*.pt"
    - "*.pth"

models:
  - key: qwen2_vl_2b_instruct
    name: Qwen2-VL 2B Instruct
    repo_id: Qwen/Qwen2-VL-2B-Instruct
    family: qwen2-vl
    task: vision_language_generation
    expected_size: 4.4 GB
    expected_size_bytes: 4429621382
    max_allowed_size: 5 GB
    local_dir: Qwen__Qwen2-VL-2B-Instruct
    recommended: true
    license: apache-2.0
    training_role: base_vlm_for_zero_shot_and_lora
    notes: >
      First-cycle pretrained VLM for image-to-text, Mermaid generation smoke
      tests, zero-shot baseline, and LoRA/QLoRA experiments. The manifest
      downloads safetensors weights plus tokenizer/processor config and skips
      duplicate non-safetensors formats.
