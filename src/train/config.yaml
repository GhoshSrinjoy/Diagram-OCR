# Training config for Qwen2-VL-2B LoRA SFT on the unified diagram dataset.
# Everything the trainer needs lives here; train_qwen.py reads only this file.

model:
  path: D:/data/diagram_extraction/models/base/Qwen__Qwen2-VL-2B-Instruct
  # Vision token budget per image (controls VRAM + speed). 768*784 ~= 602k.
  min_pixels: 3136          # 56*56
  max_pixels: 602112
  attn_implementation: sdpa # flash_attention_2 not installed on Windows

data:
  processed_dir: D:/data/diagram_extraction/processed
  # The raw mix is 96% QA. We MATERIALIZE a balanced epoch of this many rows,
  # allocated across tasks by the weights below (upsampling the tiny graph pool).
  train_samples: 8000
  eval_samples: 200
  task_weights:             # share of train_samples drawn from each task pool
    diagram_to_graph: 0.55  # the core objective (image -> nodes/edges text)
    diagram_to_code: 0.20   # tikz/svg/dot reproduction (related signal)
    diagram_qa: 0.20        # auxiliary; kept small on purpose
    diagram_caption: 0.05
  source_caps:              # cap one source from dominating its task pool (share)
    cleaned_plotqa_v2: 0.40 # PlotQA is 77% of raw -> clamp it inside diagram_qa
  eval_tasks: [diagram_to_graph]  # measure where we actually care
  seed: 42

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # These names select the LANGUAGE model only; the vision tower uses different
  # module names (attn.qkv / attn.proj / mlp.fc*) and stays frozen.
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  output_dir: D:/data/diagram_extraction/runs/qwen2vl-2b-diagram-lora
  epochs: 1
  per_device_batch_size: 1
  grad_accum: 8             # effective batch = 8
  lr: 1.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 250           # must stay a multiple of eval_steps for load_best_model_at_end
  eval_steps: 250
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  max_seq_len: 2048         # truncate long code targets (tikz can be huge)
  dataloader_workers: 4

  # Optimizer: "adamw_torch_fused" is the proven LoRA default. "muon" uses a
  # Muon(2D matrices)+AdamW(rest) hybrid via pytorch-optimizer (experimental for LoRA).
  optimizer: adamw_torch_fused
  muon_lr: 0.02             # only used when optimizer: muon (Muon update scale)

  # Checkpointing / resume / early stop.
  resume: auto              # auto-resume from latest checkpoint in output_dir; a path; or false
  load_best_model_at_end: true
  early_stopping_patience: 3 # stop if eval_loss hasn't improved for N evals (needs eval)

# Smoke mode: tiny materialized set + a handful of steps to validate the loop.
# Toggle with `python train_qwen.py --smoke` (overrides the values above).
smoke:
  train_samples: 16
  max_steps: 5
  eval_samples: 8
