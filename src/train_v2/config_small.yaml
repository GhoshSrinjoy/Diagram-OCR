# Baby Tadpole (~258M): Granite-Docling-258M (Apache-2.0, document-conversion pretraining), one
# supervised run on the final data mix (every real training source plus the synthetic sets).
# Chosen over SmolVLM-256M in an 800-step pilot on the same data: val edge F1 0.193 vs 0.150,
# node F1 0.582 vs 0.469, valid 91% vs 81%, same speed.
# Launch:  .\launch.ps1 -Config train_v2\config_small.yaml
run_name: small-granite-docling
model_path: D:/data/models/ibm-granite__granite-docling-258M
output_root: D:/data/diagram_extraction/runs
seed: 42

data:
  root: D:/data/diagram_extraction/processed_v2
  images_root: D:/data/diagram_extraction
  min_pixels: 65536          # only used for length estimates: tiled models keep their own image size
  max_pixels: 1254400
  image_longest_edge: 1536   # 512-px tiles: at most 3x3 + 1 global = 10 tiles (640 tokens); measured on CPU
                             # 1.7x faster than the 0.8B at about the same image detail (2048: barely faster)
  max_target_chars: 4500
  layout_prob: 0.5
  pad_multiple: 64
  sources:
    flowgen:              {weight: 1.0}
    didi:                 {weight: 1.0, cap: 12000}
    flowvqa:              {weight: 1.5}
    flowchart_to_mermaid: {weight: 1.5}
    hdbpmn:               {weight: 4.0}
    logicbench_1k:        {weight: 3.0}
    image_to_mermaid_v3:  {weight: 1.0}
    cas2uml:              {weight: 3.0}
    plantuml_stack_v2:    {weight: 1.0, cap: 12000}
    synth_circuits:       {weight: 1.0, cap: 5000}
    synth_bpmn:           {weight: 1.0, cap: 5000}
    synth_plantuml:       {weight: 1.0, cap: 4000}

train:
  epochs: 2
  optimizer: adamw8bit
  max_steps: null
  batch_size: 8
  grad_accum: 2              # effective batch 16
  lr: 4.0e-5                 # a small model learning a new output format from its base
  vision_lr_scale: 0.5
  weight_decay: 0.01
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  grad_checkpointing: true
  vram_fraction: 0.94
  resume: auto
  log_every: 10
  smoke_steps: 8
  num_workers: 6

eval:
  every_steps: 400
  val_loss_samples: 256
  gen_samples: 96
  gen_batch_size: 16
  gen_max_new_tokens: 1536

save:
  every_steps: 400
  keep_last: 2
