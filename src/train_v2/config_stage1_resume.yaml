# Resume of stage 1 after the power cut - the run's own config.used.json, minus the sources
# that were built after it started (cas2uml, plantuml_stack_v2, uml_in_the_wild), so the epoch mix and the saved data position
# match the original run exactly. Same run_name -> resumes from the newest checkpoint.
run_name: v2-qwen35-0.8b
model_path: D:/data/models/Qwen__Qwen3.5-0.8B
output_root: D:/data/diagram_extraction/runs
seed: 42
data:
  root: D:/data/diagram_extraction/processed_v2
  images_root: D:/data/diagram_extraction
  min_pixels: 65536
  max_pixels: 1254400
  max_target_chars: 4500
  layout_prob: 0.5
  pad_multiple: 128
  sources:
    flowgen:
      weight: 1.0
    didi:
      weight: 1.0
      cap: 12000
    flowvqa:
      weight: 1.5
    flowchart_to_mermaid:
      weight: 1.5
    hdbpmn:
      weight: 4.0
    logicbench_1k:
      weight: 3.0
    image_to_mermaid_v3:
      weight: 1.0
train:
  epochs: 1
  optimizer: adamw8bit
  max_steps: null
  batch_size: 4
  grad_accum: 4
  lr: 2.0e-05
  vision_lr_scale: 0.5
  weight_decay: 0.01
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  max_grad_norm: 1.0
  grad_checkpointing: true
  vram_fraction: 0.94
  resume: auto
  log_every: 10
  smoke_steps: 8
  num_workers: 6
eval:
  every_steps: 500
  val_loss_samples: 256
  gen_samples: 64
  gen_batch_size: 8
  gen_max_new_tokens: 1536
save:
  every_steps: 250          # ~28 min; limits loss from a power cut
  keep_last: 2
